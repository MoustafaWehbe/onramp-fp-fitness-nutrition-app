openapi: 3.1.0

info:
  title: FitCoach AI API
  version: 1.0.0
  description: REST API for the FitCoach AI fitness coaching platform

servers:
  - url: /api
    description: Default server

tags:
  - name: Auth
    description: Authentication and session management
  - name: Plan
    description: User program and weekly plan
  - name: Daily Log
    description: Logging meals and workouts each day

# ─── Reusable components ───────────────────────────────────────────────────────
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: HttpOnly access token cookie set on login

  schemas:
    RegisterBody:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 8
          description: Must contain at least one uppercase letter and one number
          example: Password1
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Jane Doe

    LoginBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 1
          example: Password1

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        email:
          type: string
          format: email
          example: user@example.com
        name:
          type: string
          example: Jane Doe
        role:
          type: string
          enum: [user, admin]
          example: user
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Invalid credentials

    MessageResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            message:
              type: string
              example: Success

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Validation failed
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: email
              message:
                type: string
                example: Invalid email address

    MyPlanResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        title:
          type: string
          example: Lose 10kg in 5 Months
        goal:
          type: string
          example: Fat Loss
        level:
          type: string
          example: Intermediate
        weeks:
          type: integer
          example: 20
        calories_per_day:
          type: integer
          example: 1850
        current_week:
          type: integer
          example: 7
        current_day:
          type: integer
          example: 3
        week_plan:
          type: object
          description: Full structured week plan with meals and workouts

    DailyLogResponse:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2025-06-18"
        meals:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/MealLogBody"
        workout:
          $ref: "#/components/schemas/WorkoutLogBody"

    MealLogBody:
      type: object
      required: [userProgramId, logDate, mealType, status]
      properties:
        userProgramId:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        logDate:
          type: string
          format: date
          example: "2025-06-18"
        mealType:
          type: string
          enum: [breakfast, snack, lunch, dinner]
          example: breakfast
        status:
          type: string
          enum: [followed, modified, skipped]
          example: followed
        note:
          type: string
          example: Had a chicken sandwich instead
        actualCalories:
          type: integer
          example: 480

    WorkoutLogBody:
      type: object
      required: [userProgramId, logDate, status]
      properties:
        userProgramId:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        logDate:
          type: string
          format: date
          example: "2025-06-18"
        status:
          type: string
          enum: [completed, modified, skipped]
          example: completed
        note:
          type: string
          example: Hit a new PR on bench press
        completedExercises:
          type: array
          items:
            type: string
          example: ["Barbell Bench Press", "Lat Pulldown"]

# ─── Paths ─────────────────────────────────────────────────────────────────────
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive auth cookies
      operationId: login
      description: >
        On success, sets two HttpOnly cookies: `accessToken` (15 min) and
        `refreshToken` (7 days). Include `credentials: "include"` in fetch calls.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: accessToken=...; HttpOnly; Path=/api
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh the access token
      operationId: refreshToken
      description: Reads the `refreshToken` cookie and issues new auth cookies.
      responses:
        "200":
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Missing or invalid refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout and clear auth cookies
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current authenticated user
      operationId: getMe
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /my-plan:
    get:
      tags: [Plan]
      summary: Get the user's active program and week plan
      operationId: getMyPlan
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Active program with full week plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/MyPlanResponse"
        "404":
          description: No active program found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /daily-log:
    get:
      tags: [Daily Log]
      summary: Get the log for a specific date
      operationId: getDailyLog
      security:
        - cookieAuth: []
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2025-06-18"
      responses:
        "200":
          description: The daily log for that date
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DailyLogResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /daily-log/meal:
    post:
      tags: [Daily Log]
      summary: Save a meal log entry
      operationId: logMeal
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MealLogBody"
      responses:
        "200":
          description: Meal log saved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /daily-log/workout:
    post:
      tags: [Daily Log]
      summary: Save a workout log entry
      operationId: logWorkout
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutLogBody"
      responses:
        "200":
          description: Workout log saved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"